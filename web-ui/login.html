    <main class="login-main">
        <section class="card login-card" aria-labelledby="login-title">
            <div class="login-header">
                <img src="__BASE_HREF__/static/img/qbm_logo.png" alt="qBit Manage" class="login-logo">
                <h1 id="login-title" class="login-title">qBit Manage</h1>
                <p class="login-subtitle">__SUBTITLE__</p>
            </div>
            <div class="login-body">
                __OIDC__
                __DIVIDER__
                __LOCAL__
            </div>
        </section>
    </main>

    <script type="module" src="__BASE_HREF__/static/js/login.js"></script>
    <script>
        (function () {
            var form = document.getElementById('login-form');
            if (!form) return;
            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                var msg = document.getElementById('msg');
                var submitBtn = document.getElementById('login-submit');
                var origLabel = submitBtn ? submitBtn.textContent : '';
                if (msg) {
                    msg.textContent = '';
                    msg.classList.add('hidden');
                }
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Signing in...';
                }
                try {
                    var r = await fetch(__BASE_JS__ + '/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ username: form.username.value, password: form.password.value })
                    });
                    if (r.ok) {
                        location.href = __BASE_JS__ + '/';
                        return;
                    }
                    var errText = r.status === 401 ? 'Login failed' : await r.text();
                    if (msg) {
                        msg.textContent = errText || 'Login failed';
                        msg.classList.remove('hidden');
                    }
                } catch (err) {
                    if (msg) {
                        msg.textContent = 'Unable to reach the server. Please try again.';
                        msg.classList.remove('hidden');
                    }
                } finally {
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.textContent = origLabel;
                    }
                }
            });
        })();
    </script>
</body>
</html>
